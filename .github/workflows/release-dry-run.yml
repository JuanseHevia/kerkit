name: Release dry-run

# Proves a release would succeed without ever touching credentials, so it is
# safe to run on pull requests — including from forks. It intentionally
# declares no secrets and no id-token permission: there is nothing here for a
# malicious PR to exfiltrate. It validates the changeset state and dry-run
# publishes all five @kerkit/* packages with public access.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dry-run:
    name: Publish dry-run (no credentials)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Ensure base branch ref
        # `changeset status` diffs against the configured baseBranch (main) via
        # merge-base; on a PR checkout that local ref may be absent, so
        # materialize it. Non-fatal if it is already present.
        run: git fetch --no-tags origin +refs/heads/main:refs/heads/main || true

      - name: Changeset status
        # Prints the pending release plan (the source of the generated release
        # notes) and fails if any changeset file is malformed.
        run: npx changeset status

      - name: Validate publish (dry-run, all packages)
        run: node scripts/verify-publish.mjs
